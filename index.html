<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Inventra | Smart Trolley</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f5f9;color:#172033}
header{background:#111827;color:white;text-align:center;padding:18px 14px}
header h1{margin:0 0 6px;font-size:clamp(25px,6vw,34px)}
header p{margin:0}
main{width:100%;max-width:760px;margin:auto;padding:12px}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0f172a0b}
button,a.btn{display:inline-block;min-height:44px;padding:12px 16px;border:0;border-radius:9px;background:#2563eb;color:white;text-decoration:none;font-weight:bold;margin:5px 4px 5px 0;font-size:16px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.secondary{background:#64748b!important}
input,select{width:100%;min-height:46px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:17px;background:white;color:#172033}
label{display:block;margin:12px 0 6px}
.notice{padding:12px;border-radius:9px;background:#e0f2fe;color:#075985;margin-top:10px;overflow-wrap:anywhere}
.product{padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0}
#authorizeLink{display:none;background:#15803d}
#reader{width:100%;max-width:520px;margin:12px auto;overflow:hidden;border-radius:10px}
#reader video{width:100%!important;max-width:100%!important;object-fit:cover}
.camera-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.camera-controls button{flex:1 1 130px}
small{color:#64748b}
@media(max-width:480px){
 main{padding:8px}
 .card{padding:13px;margin:9px 0;border-radius:12px}
 button,a.btn{width:100%;margin:5px 0;text-align:center}
 #reader{max-width:100%}
}
</style>
</head>
<body>
<header><h1>🛒 INVENTRA</h1><p>Smart Trolley Shopping System</p></header>
<main>
<section class="card">
<h2>Scan a product</h2>
<p>Tap <b>Start camera</b> and allow camera access. Point the rear camera at the product barcode. After it is detected, tap <b>Authorize on Trolley</b>.</p>
<div id="reader"></div>
<div class="camera-controls">
<button id="startBtn" type="button" onclick="startScanner()">Start camera</button>
<button id="stopBtn" class="secondary" type="button" onclick="stopScanner()" disabled>Stop camera</button>
</div>
<div id="cameraPickerWrap" style="display:none">
<label for="cameraPicker"><b>Choose camera</b></label>
<select id="cameraPicker" aria-label="Choose camera"></select>
</div>
<label for="barcode"><b>Barcode (manual entry)</b></label>
<input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Enter barcode manually">
<button type="button" onclick="handleCode(document.getElementById('barcode').value)">Use barcode</button>
<div id="message" class="notice" role="status" aria-live="polite">Ready to scan.</div>
<a id="authorizeLink" class="btn" target="_blank" rel="noopener">Authorize on Trolley</a>
<a class="btn secondary" href="http://172.20.10.5/status" target="_blank" rel="noopener">Open Live Trolley Status</a>
</section>
<section class="card"><h2>Product catalog</h2><div id="catalog"></div></section>
</main>
<script>
const ESP='http://172.20.10.5';
const products={
'8906160690209':['Tata Salt',80,'🧂'],
'8902102163930':['Aashirvaad Atta',100,'🌾'],
'8906073788116':['Amul Butter',40,'🧈'],
'8908000034334':['Milk',35,'🥛'],
'8901324010664':['Green Peas',45,'🫛'],
'8906136382824':['Kwality Walls Ice Cream',60,'🍦'],
'8906014765985':['Kurkure',10,'🌶️'],
'8901860630241':['Pringles',20,'🥔'],
'8901248164252':['Cheetos',15,'🧀'],
'8904275300259':['Mdew',10,'🥤']
};

let scanner=null,locked=false,cameraList=[];
function say(t){document.getElementById('message').textContent=t}

function handleCode(raw){
 const code=String(raw||'').replace(/\\D/g,'').trim(),p=products[code];
 if(!p){say('Barcode not in demo catalog. Please scan one of the listed products.');return}
 document.getElementById('barcode').value=code;
 const a=document.getElementById('authorizeLink');
 a.href=ESP+'/authorize?name='+encodeURIComponent(p[0])+'&t='+Date.now();
 a.style.display='inline-block';
 a.textContent='Authorize '+p[0]+' on Trolley';
 say('Scanned '+p[0]+'. Tap the green authorization button, then place the item on the trolley.');
}

function scannerConfig(){
 return {
  fps:10,
  qrbox:(viewWidth,viewHeight)=>({
   width:Math.max(220,Math.min(viewWidth-24,420)),
   height:Math.max(90,Math.min(150,Math.floor(viewHeight*.42)))
  }),
  aspectRatio:1.777,
  formatsToSupport:[
   Html5QrcodeSupportedFormats.EAN_13,
   Html5QrcodeSupportedFormats.EAN_8,
   Html5QrcodeSupportedFormats.UPC_A,
   Html5QrcodeSupportedFormats.UPC_E,
   Html5QrcodeSupportedFormats.CODE_128,
   Html5QrcodeSupportedFormats.CODE_39
  ]
 };
}

function onDetected(text){
 if(locked)return;
 locked=true;
 handleCode(text);
 setTimeout(()=>locked=false,1800);
}

async function startWithCamera(camera){
 if(!scanner)scanner=new Html5Qrcode('reader',{verbose:false});
 await scanner.start(camera,scannerConfig(),onDetected,()=>{});
 document.getElementById('startBtn').disabled=true;
 document.getElementById('stopBtn').disabled=false;
 say('Camera is on. Hold the barcode steady inside the scanning box.');
}

async function startScanner(){
 if(scanner && scanner.isScanning)return;
 if(!window.isSecureContext){
  say('Camera access needs a secure HTTPS page. Open the GitHub Pages address beginning with https://');
  return;
 }
 if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  say('This browser does not provide camera access. Open this page in Chrome or Safari using the HTTPS website address.');
  return;
 }
 document.getElementById('startBtn').disabled=true;
 say('Requesting camera permission… Please tap Allow if your phone asks.');
 try{
  scanner=new Html5Qrcode('reader',{verbose:false});
  // First request the phone's rear camera. If that fails, list available cameras.
  try{
   await startWithCamera({facingMode:'environment'});
  }catch(firstError){
   const cams=await Html5Qrcode.getCameras();
   cameraList=cams||[];
   if(!cameraList.length)throw firstError;
   const picker=document.getElementById('cameraPicker');
   picker.innerHTML='';
   cameraList.forEach((cam,i)=>{
    const option=document.createElement('option');
    option.value=cam.id;
    option.textContent=cam.label||('Camera '+(i+1));
    picker.appendChild(option);
   });
   document.getElementById('cameraPickerWrap').style.display='block';
   await startWithCamera(cameraList[0].id);
  }
 }catch(e){
  scanner=null;
  document.getElementById('startBtn').disabled=false;
  document.getElementById('stopBtn').disabled=true;
  const detail=(e&&e.message)?e.message:String(e);
  say('Camera could not start. Check that you opened the HTTPS GitHub Pages link, allow camera permission in your browser settings, and close other apps using the camera. Details: '+detail+' You can still enter the barcode manually below.');
 }
}

async function stopScanner(){
 if(scanner){
  try{if(scanner.isScanning)await scanner.stop();await scanner.clear()}catch(e){}
  scanner=null;
 }
 document.getElementById('startBtn').disabled=false;
 document.getElementById('stopBtn').disabled=true;
 say('Camera stopped.');
}

document.getElementById('cameraPicker').addEventListener('change',async function(){
 const selected=this.value;
 if(!selected)return;
 try{
  if(scanner&&scanner.isScanning)await scanner.stop();
  await startWithCamera(selected);
 }catch(e){say('Could not switch camera: '+(e.message||e));}
});

document.getElementById('catalog').innerHTML=Object.entries(products).map(([code,p])=>
 `<div class="product">${p[2]} <b>${p[0]}</b> — ₹${p[1]}<br><small>${code}</small><br><button type="button" onclick="handleCode('${code}')">Select</button></div>`).join('');

document.addEventListener('visibilitychange',()=>{
 if(document.hidden && scanner && scanner.isScanning)stopScanner();
});
</script>
</body>
</html>
